<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BDSM 테스트 250</title>
<style>
  :root {
    --bg: #0c0c10;
    --card: #16161f;
    --accent: #ff4d6d;
    --accent2: #c77dff;
    --text: #f2f2f7;
    --muted: #8e8e9a;
    --border: #2c2c3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .container {
    max-width: 560px;
    margin: 0 auto;
    padding: 16px 14px 50px;
  }
  .header {
    text-align: center;
    padding: 28px 0 18px;
  }
  .header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 6px;
  }
  .header p { color: var(--muted); font-size: 0.88rem; }
  .disclaimer {
    background: #1a1515;
    border: 1px solid #3a2828;
    border-radius: 12px;
    padding: 12px 14px;
    font-size: 0.8rem;
    color: #d4a0a0;
    margin-bottom: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 16px;
    margin-bottom: 14px;
  }
  .nick-input {
    width: 100%;
    background: #0e0e14;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 14px;
    color: var(--text);
    font-size: 1rem;
    margin: 12px 0 16px;
    outline: none;
  }
  .nick-input:focus { border-color: var(--accent); }
  .start-btn, .btn-next {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #e04080);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 1.05rem;
    font-weight: 700;
    cursor: pointer;
  }
  .start-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .progress-wrap { margin-bottom: 16px; }
  .progress-text {
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--muted);
    margin-bottom: 5px;
  }
  .progress-bar {
    height: 5px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.25s ease;
  }
  .q-num {
    font-size: 0.78rem;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 8px;
  }
  .q-text {
    font-size: 1.02rem;
    font-weight: 600;
    margin-bottom: 16px;
    line-height: 1.4;
  }
  .option {
    display: block;
    width: 100%;
    text-align: left;
    background: #0e0e16;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    color: var(--text);
    font-size: 0.92rem;
    cursor: pointer;
    transition: all 0.12s ease;
  }
  .option:hover, .option:active {
    border-color: var(--accent);
    background: #1c121c;
  }
  .option.selected {
    border-color: var(--accent);
    background: linear-gradient(135deg, #271520, #1c1224);
  }
  .nav {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-prev {
    flex: 0.4;
    background: #2a2a38;
    color: var(--text);
  }
  .btn-next { flex: 1; }
  .btn-restart {
    width: 100%;
    background: var(--border);
    color: var(--text);
    margin-top: 14px;
    padding: 13px;
  }
  .result-header {
    text-align: center;
    margin-bottom: 18px;
  }
  .result-header h2 { font-size: 1.3rem; margin-bottom: 4px; }
  .result-header .nick {
    color: var(--accent2);
    font-weight: 600;
    font-size: 1.05rem;
  }
  .result-header p { color: var(--muted); font-size: 0.85rem; }
  .result-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }
  .result-card.top {
    border-color: var(--accent);
    background: linear-gradient(135deg, #241520, #1a1224);
  }
  .result-icon {
    font-size: 2.2rem;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #1a1a28;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .result-body { flex: 1; }
  .result-rank {
    font-size: 0.72rem;
    color: var(--accent);
    font-weight: 700;
    margin-bottom: 2px;
  }
  .result-name {
    font-size: 1.08rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .score-pct {
    font-size: 0.85rem;
    color: var(--accent2);
    font-weight: 600;
  }
  .result-bar {
    height: 6px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    margin: 6px 0;
  }
  .result-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
  }
  .result-desc {
    font-size: 0.84rem;
    color: #b8b8c8;
    line-height: 1.45;
  }
  .combo-box {
    background: #12121a;
    border-radius: 12px;
    padding: 14px;
    margin-top: 16px;
    border: 1px solid var(--border);
  }
  .combo-box h3 {
    font-size: 0.9rem;
    margin-bottom: 6px;
    color: var(--accent2);
  }
  .combo-box p { font-size: 0.86rem; color: #a8a8b8; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<div class="container">

  <div id="startScreen">
    <div class="header">
      <h1>BDSM 테스트</h1>
      <p>플레이 · 구속 · 행동 · 상황</p>
    </div>
    <div class="disclaimer">
      ⚠️ 성인(19+) 전용입니다.<br>
      성적 취향을 솔직하게 묻는 설문입니다. 결과는 재미와 자기 탐색용이며, 실제 플레이 시 반드시 동의와 안전을 지키세요.
    </div>
    <div class="card">
      <p style="font-size:0.9rem; color:#c0c0d0; margin-bottom:4px;">닉네임을 입력하세요</p>
      <input type="text" id="nickInput" class="nick-input" placeholder="닉네임 입력" maxlength="12" oninput="checkNick()">
      <button class="start-btn" id="startBtn" onclick="startQuiz()" disabled>테스트 시작하기</button>
      <p style="font-size:0.78rem; color:var(--muted); margin-top:12px; text-align:center;">
        행동과 상황 위주<br>
        실제로 흥분되는 쪽으로 고르세요
      </p>
    </div>
  </div>

  <div id="quizScreen" class="hidden">
    <div class="progress-wrap">
      <div class="progress-text">
        <span id="progressText">1 / 250</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0.4%"></div>
      </div>
    </div>
    <div class="card">
      <div class="q-num" id="qNum">Q1</div>
      <div class="q-text" id="qText"></div>
      <div id="options"></div>
    </div>
    <div class="nav">
      <button class="btn-prev" id="btnPrev" onclick="prevQ()" disabled>이전</button>
      <button class="btn-next" id="btnNext" onclick="nextQ()" disabled>다음</button>
    </div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="result-header">
      <h2>성향 결과</h2>
      <div class="nick" id="resultNick"></div>
      <p>상위 성향 순으로 정렬됩니다</p>
    </div>
    <div id="resultList"></div>
    <div class="combo-box" id="comboBox"></div>
    <button class="btn-restart" onclick="restart()">다시 테스트하기</button>
  </div>
</div>

let current = 0;
let answers = new Array(questions.length).fill(null);
let scores = {};
let nickname = "";

function checkNick() {
  const v = document.getElementById('nickInput').value.trim();
  document.getElementById('startBtn').disabled = v.length < 1;
}

function initScores() {
  scores = {};
  Object.keys(categories).forEach(k => scores[k] = 0);
}

function startQuiz() {
  nickname = document.getElementById('nickInput').value.trim() || "익명";
  document.getElementById('startScreen').classList.add('hidden');
  document.getElementById('quizScreen').classList.remove('hidden');
  initScores();
  current = 0;
  answers = new Array(questions.length).fill(null);
  showQuestion();
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('qNum').textContent = `Q${current + 1}`;
  document.getElementById('qText').textContent = q.q;
  document.getElementById('progressText').textContent = `${current + 1} / ${questions.length}`;
  const pct = ((current + 1) / questions.length * 100).toFixed(0);
  document.getElementById('progressPct').textContent = pct + '%';
  document.getElementById('progressFill').style.width = pct + '%';

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  q.opts.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'option' + (answers[current] === i ? ' selected' : '');
    btn.textContent = opt.t;
    btn.onclick = () => selectOption(i);
    optsDiv.appendChild(btn);
  });

  document.getElementById('btnPrev').disabled = current === 0;
  document.getElementById('btnNext').disabled = answers[current] === null;
  document.getElementById('btnNext').textContent = current === questions.length - 1 ? '결과 보기' : '다음';
}

function selectOption(i) {
  answers[current] = i;
  showQuestion();
}

function nextQ() {
  if (answers[current] === null) return;
  if (current === questions.length - 1) {
    calcResult();
    return;
  }
  current++;
  showQuestion();
}

function prevQ() {
  if (current > 0) {
    current--;
    showQuestion();
  }
}

function calcResult() {
  initScores();
  answers.forEach((ans, qi) => {
    if (ans === null) return;
    const s = questions[qi].opts[ans].s;
    Object.keys(s).forEach(k => {
      scores[k] = (scores[k] || 0) + s[k];
    });
  });

  const sorted = Object.keys(scores)
    .map(k => ({ key: k, score: scores[k], ...categories[k] }))
    .filter(x => x.score > 0)
    .sort((a, b) => b.score - a.score);

  const maxScore = sorted.length ? sorted[0].score : 1;

  document.getElementById('quizScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('resultNick').textContent = nickname + " 님의 결과";

  const list = document.getElementById('resultList');
  list.innerHTML = '';

  sorted.slice(0, 10).forEach((item, idx) => {
    const pct = Math.round((item.score / maxScore) * 100);
    const div = document.createElement('div');
    div.className = 'result-card' + (idx < 3 ? ' top' : '');
    div.innerHTML = `
      <div class="result-icon">${item.icon}</div>
      <div class="result-body">
        <div class="result-rank">${idx + 1}위</div>
        <div class="result-name">${item.name}</div>
        <div class="score-pct">${pct}% 매칭</div>
        <div class="result-bar"><div class="result-fill" style="width:${pct}%"></div></div>
        <div class="result-desc">${item.desc}</div>
      </div>
    `;
    list.appendChild(div);
  });

  const topKeys = sorted.slice(0, 3).map(x => x.key);
  let comboText = '';
  if (topKeys.includes('switch') && (topKeys.includes('dominant') || topKeys.includes('submissive'))) {
    comboText = '스위치 성향이 강하면서도 한쪽으로 기우는 편입니다. 상황에 따라 유연하게 역할을 바꿀 수 있어요.';
  } else if (topKeys.includes('daddy') && topKeys.includes('little')) {
    comboText = '돌봄을 주고받는 성향이 동시에 높습니다. 돌봄형 관계에 강하게 끌릴 수 있어요.';
  } else if (topKeys.includes('brat') && topKeys.includes('brattamer')) {
    comboText = '브랫과 브랫 테이머가 함께 높습니다. 도발하고 길들이는 밀당 자체를 즐기는 타입일 수 있어요.';
  } else if (topKeys.includes('owner') && topKeys.includes('pet')) {
    comboText = '오너와 펫 성향이 모두 있습니다. 소유·훈련 플레이에서 주고받는 것 모두 가능합니다.';
  } else if (topKeys.includes('sadist') && topKeys.includes('masochist')) {
    comboText = '사디스트와 마조히스트가 함께 높습니다. 통증 플레이에서 주는 것과 받는 것 모두 흥분 포인트입니다.';
  } else if (topKeys.includes('degrader') && topKeys.includes('degradee')) {
    comboText = '디그레이더와 디그레이디가 동시에 높습니다. 낮추는 플레이를 양방향으로 즐길 수 있어요.';
  } else if (topKeys.includes('vanilla') && sorted[0].key === 'vanilla') {
    comboText = '바닐라 성향이 가장 강합니다. 특별한 파워플레이보다 서로 편안하고 애정 있는 쪽을 더 선호하는 편입니다.';
  } else if (topKeys.includes('master') || topKeys.includes('slave')) {
    comboText = '마스터/슬레이브 쪽 성향이 드러납니다. 높은 강도의 파워 익스체인지를 원하거나 상상하는 편입니다.';
  } else if (topKeys.includes('rigger')) {
    comboText = '리거 성향이 두드러집니다. 수갑·끈·로프 등으로 구속하는 행위에 강한 관심을 가지고 있어요.';
  } else {
    comboText = '상위 성향들을 조합해보면, 당신이 실제로 흥분하는 포인트가 꽤 명확하게 보입니다. 상위 2~3개를 중심으로 상대와 이야기해보세요.';
  }

  document.getElementById('comboBox').innerHTML = `
    <h3>조합 해석</h3>
    <p>${comboText}</p>
    <p style="margin-top:10px; font-size:0.82rem; color:#888;">
      ※ 이 결과는 재미와 자기 탐색용입니다. 실제 관계에서는 상대와 충분히 대화하고 동의를 구하세요.
    </p>
  `;
}

function restart() {
  document.getElementById('resultScreen').classList.add('hidden');
  document.getElementById('startScreen').classList.remove('hidden');
  document.getElementById('nickInput').value = '';
  document.getElementById('startBtn').disabled = true;
}
</script>
